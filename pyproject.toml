[project]
name = "a3-boilerplate"
version = "0.1.0"
description = "ANLP Assignment 3"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "wandb>=0.16.0",
    "huggingface-hub>=0.20.0",
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "editdistance>=0.8.0",
    "pyyaml>=6.0",
    "scipy>=1.11.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
